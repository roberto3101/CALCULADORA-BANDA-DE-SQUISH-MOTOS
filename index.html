  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{overflow-x:hidden}
  body{
    margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:radial-gradient(1100px 760px at 50% -8%, #171c27 0%, #0f1115 58%);
    color:var(--txt);
    min-height:100vh;display:flex;justify-content:center;align-items:flex-start;
    padding:22px;overflow-x:hidden;position:relative;
  }
  /* marca de agua: el puma de fondo, sutil */
  body::before{
    content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
    background:var(--logo) no-repeat center 60px;
    background-size:min(580px,130%) auto;
    opacity:.06;
  }
  .wrap{width:100%;max-width:520px;position:relative;z-index:1}

  /* marca / logo principal */
  .brand{position:relative;text-align:center;margin:0 0 8px}
  .brand::before{
    content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(330px,88%);height:150px;z-index:-1;
    background:radial-gradient(ellipse at center, rgba(255,122,24,.32), rgba(255,122,24,0) 70%);
    filter:blur(8px);
  }
  .brand-logo{
    width:min(290px,80%);aspect-ratio:388/274;margin:0 auto;
    background:var(--logo) center/contain no-repeat;
    filter:drop-shadow(0 0 18px rgba(255,122,24,.55)) drop-shadow(0 0 5px rgba(255,170,90,.5));
  }
  h1{font-size:clamp(18px,4.8vw,22px);margin:2px 0 2px;text-align:center;letter-spacing:.3px;font-weight:700}
  .sub{color:var(--muted);text-align:center;font-size:clamp(12.5px,3.6vw,14px);margin:0 0 22px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:20px;margin-bottom:16px;
  }
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  .field{position:relative;margin-bottom:18px}
  input[type=number]{
    width:100%;font-size:28px;font-weight:700;background:#11141a;
    border:1px solid var(--line);border-radius:12px;color:var(--txt);
    padding:15px 50px 15px 16px;outline:none;
    -moz-appearance:textfield;appearance:textfield;
  }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  input:focus{border-color:var(--accent)}
  .unit{position:absolute;right:15px;top:50%;transform:translateY(-50%);
    color:var(--muted);font-size:16px;font-weight:600;pointer-events:none}
  /* botones +/- */
  .stepper{display:flex;gap:8px;align-items:stretch}
  .inwrap{position:relative;flex:1;min-width:0}
  .step{
    flex:0 0 auto;width:54px;border:1px solid var(--line);background:#11141a;
    color:var(--txt);font-size:30px;font-weight:600;line-height:1;border-radius:12px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    user-select:none;-webkit-user-select:none;touch-action:manipulation;
    transition:transform .08s, background .15s, border-color .15s, color .15s;
  }
  .step:hover{border-color:var(--accent);color:var(--accent)}
  .step:active{background:var(--accent);border-color:var(--accent);color:#10131a;transform:scale(.94)}
  .presets{display:flex;gap:9px;margin-bottom:4px;flex-wrap:wrap}
  .preset{
    flex:1;min-width:64px;background:#11141a;border:1px solid var(--line);
    color:var(--txt);border-radius:10px;padding:11px 0;font-size:16px;
    font-weight:600;cursor:pointer;transition:.15s;
  }
  .preset:hover{border-color:var(--accent)}
  .preset.active{background:var(--accent);border-color:var(--accent);color:#10131a}
  .result{
    background:linear-gradient(135deg,#1c2230,#161a22);
    border:1px solid var(--line);border-radius:16px;padding:22px;text-align:center;
  }
  .result .lbl{color:var(--muted);font-size:13px;margin-bottom:8px;
    text-transform:uppercase;letter-spacing:.06em}
  .result .big{font-size:clamp(38px,12vw,52px);font-weight:800;color:var(--accent);line-height:1.05}
  .result .eq{color:var(--muted);font-size:13px;margin-top:10px}
  .grid{display:flex;gap:14px;margin-top:16px}
  .mini{
    flex:1;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:16px;text-align:center;
  }
  .mini .v{font-size:24px;font-weight:700;color:var(--accent2)}
  .mini .k{color:var(--muted);font-size:12px;margin-top:3px}
  .diag{display:flex;justify-content:center;margin:18px 0 0}
  .diag svg{width:100%;max-width:380px;height:auto}
  .foot{color:var(--muted);font-size:12.5px;text-align:center;margin-top:18px;line-height:1.7}
  .credit{text-align:center;font-size:12.5px;color:var(--muted);margin:16px 0 4px}
  .credit a{color:var(--accent2);text-decoration:none;font-weight:600}
  .credit a:hover{text-decoration:underline}
  @media (max-width:380px){
    body{padding:14px}
    .card,.result{padding:16px}
    .grid{gap:10px}
  }

  /* ---- tooltips ---- */
  .tip{position:relative;cursor:help;outline:none}
  .tip .lbl, .tip .k{border-bottom:1px dotted rgba(154,163,178,.55)}
  .tip::after{
    content:attr(data-tip);
    position:absolute;left:50%;bottom:calc(100% + 10px);transform:translateX(-50%);
    width:min(220px,74vw);background:#0a0c10;color:var(--txt);border:1px solid var(--line);
    padding:10px 12px;border-radius:10px;font-size:12.5px;line-height:1.45;
    font-weight:400;text-transform:none;letter-spacing:normal;
    opacity:0;pointer-events:none;transition:opacity .15s;z-index:20;
    box-shadow:0 10px 28px rgba(0,0,0,.5);
  }
  .tip::before{
    content:'';position:absolute;left:50%;bottom:calc(100% + 3px);transform:translateX(-50%);
    border:7px solid transparent;border-top-color:var(--line);
    opacity:0;pointer-events:none;transition:opacity .15s;z-index:20;
  }
  .tip:hover::after,.tip:focus::after,.tip:hover::before,.tip:focus::before{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="brand-logo" role="img" aria-label="Warure"></div>
  </div>
  <h1>Calculadora de Banda de Squish</h1>
  <p class="sub">Diámetro exterior + porcentaje → diámetro interior</p>

  <div class="card">
    <div class="field">
      <label>Diámetro exterior (cilindro)</label>
      <div class="stepper">
        <button type="button" class="step" data-target="diam" data-dir="-1" aria-label="Disminuir diámetro">−</button>
        <div class="inwrap">
          <input id="diam" type="number" inputmode="decimal" value="54" min="0" step="any" data-step="0.5">
          <span class="unit">mm</span>
        </div>
        <button type="button" class="step" data-target="diam" data-dir="1" aria-label="Aumentar diámetro">+</button>
      </div>
    </div>

    <label>Porcentaje de squish (área)</label>
    <div class="presets" id="presets">
      <button class="preset" data-p="40">40%</button>
      <button class="preset active" data-p="50">50%</button>
      <button class="preset" data-p="60">60%</button>
    </div>
    <div class="field" style="margin-top:9px;margin-bottom:0">
      <div class="stepper">
        <button type="button" class="step" data-target="pct" data-dir="-1" aria-label="Disminuir porcentaje">−</button>
        <div class="inwrap">
          <input id="pct" type="number" inputmode="decimal" value="50" min="0" max="99.9" step="any" data-step="1">
          <span class="unit">%</span>
        </div>
        <button type="button" class="step" data-target="pct" data-dir="1" aria-label="Aumentar porcentaje">+</button>
      </div>
    </div>
  </div>

  <div class="result tip" tabindex="0"
       data-tip="Diámetro del círculo interior (la cámara). Se obtiene aplicando el porcentaje de squish por área al diámetro exterior: exterior × √(1 − %).">
    <div class="lbl">Diámetro interior</div>
    <div class="big"><span id="out">38,18</span> mm</div>
    <div class="eq" id="eq">50% de squish sobre Ø 54 mm</div>
  </div>

  <!-- Dibujo realista: culata vista desde arriba -->
  <div class="diag">
    <svg id="svg" viewBox="0 0 320 380" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="gAlu" cx="40%" cy="32%" r="75%">
          <stop offset="0%"  stop-color="#79828f"/>
          <stop offset="55%" stop-color="#474e59"/>
          <stop offset="100%" stop-color="#2b303a"/>
        </radialGradient>
        <radialGradient id="gSquish" cx="44%" cy="36%" r="72%">
          <stop offset="0%"  stop-color="#dd9152"/>
          <stop offset="60%" stop-color="#b76324"/>
          <stop offset="100%" stop-color="#8f4a14"/>
        </radialGradient>
        <radialGradient id="gChamber" cx="40%" cy="34%" r="72%">
          <stop offset="0%"  stop-color="#576070"/>
          <stop offset="55%" stop-color="#2e343d"/>
          <stop offset="100%" stop-color="#191d24"/>
        </radialGradient>
        <radialGradient id="gBolt" cx="38%" cy="32%" r="75%">
          <stop offset="0%"  stop-color="#3c434e"/>
          <stop offset="100%" stop-color="#171a20"/>
        </radialGradient>
        <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000000" flood-opacity="0.5"/>
        </filter>
        <marker id="arr" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
          <path d="M1.5,1.5 L6,4.5 L1.5,7.5" fill="none" stroke="#ffe0c0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
      </defs>

      <!-- cuerpo de aluminio con sombra -->
      <circle cx="160" cy="190" r="150" fill="url(#gAlu)" filter="url(#shadow)"/>
      <circle cx="160" cy="190" r="150" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1.5"/>

      <!-- aletas de refrigeración (ranuras concéntricas) -->
      <g fill="none">
        <circle cx="160" cy="190" r="144" stroke="rgba(0,0,0,0.28)" stroke-width="2.5"/>
        <circle cx="160" cy="190" r="142" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
        <circle cx="160" cy="190" r="133" stroke="rgba(0,0,0,0.28)" stroke-width="2.5"/>
        <circle cx="160" cy="190" r="131" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
        <circle cx="160" cy="190" r="122" stroke="rgba(0,0,0,0.28)" stroke-width="2.5"/>
        <circle cx="160" cy="190" r="120" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
      </g>

      <!-- escalón de la junta (cara plana) -->
      <circle cx="160" cy="190" r="113" fill="#3a414c"/>
      <!-- banda de squish (anillo anodizado) -->
      <circle cx="160" cy="190" r="108" fill="url(#gSquish)" stroke="#e7a468" stroke-width="1.4"/>
      <!-- cámara de combustión abovedada -->
      <circle id="cInner" cx="160" cy="190" r="76" fill="url(#gChamber)" stroke="#15181e" stroke-width="2.5"/>
      <circle id="cInner2" cx="160" cy="190" r="76" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" transform="translate(0,-1)"/>

      <!-- bujía al centro -->
      <circle cx="160" cy="190" r="13" fill="url(#gBolt)" stroke="#0f1115" stroke-width="1.5"/>
      <circle cx="160" cy="190" r="6"  fill="#0c0e12"/>

      <!-- tornillos (4) -->
      <g>
        <circle cx="252.6" cy="97.4"  r="10" fill="url(#gBolt)" stroke="#0f1115" stroke-width="1.4"/>
        <circle cx="252.6" cy="97.4"  r="4.5" fill="#0c0e12"/>
        <circle cx="67.4"  cy="97.4"  r="10" fill="url(#gBolt)" stroke="#0f1115" stroke-width="1.4"/>
        <circle cx="67.4"  cy="97.4"  r="4.5" fill="#0c0e12"/>
        <circle cx="67.4"  cy="282.6" r="10" fill="url(#gBolt)" stroke="#0f1115" stroke-width="1.4"/>
        <circle cx="67.4"  cy="282.6" r="4.5" fill="#0c0e12"/>
        <circle cx="252.6" cy="282.6" r="10" fill="url(#gBolt)" stroke="#0f1115" stroke-width="1.4"/>
        <circle cx="252.6" cy="282.6" r="4.5" fill="#0c0e12"/>
      </g>

      <!-- etiqueta SQUISH + guía -->
      <text x="160" y="24" fill="#e9a86a" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="2.5">SQUISH</text>
      <line x1="160" y1="31" x2="160" y2="98" stroke="#e9a86a" stroke-width="1.2" stroke-opacity="0.85"/>

      <!-- cotas dinámicas -->
      <line id="dLine" x1="84" y1="190" x2="236" y2="190" stroke="#d7dee7" stroke-width="1" stroke-dasharray="5 3" opacity="0.45"/>
      <line id="bArrow" x1="236" y1="190" x2="268" y2="190" stroke="#ffe0c0" stroke-width="1.6"
            marker-start="url(#arr)" marker-end="url(#arr)"/>

      <text id="tInner" x="160" y="184" fill="#eef2f6" font-size="14" font-weight="700" text-anchor="middle">Ø 38,18</text>
      <text x="160" y="205" fill="#aab3bf" font-size="11" text-anchor="middle">interior</text>
      <text id="tBand"  x="252" y="179" fill="#f2c89c" font-size="12" font-weight="700" text-anchor="middle">7,91</text>

      <!-- diámetro exterior -->
      <text x="160" y="366" fill="#9aa3b2" font-size="13" text-anchor="middle">Ø exterior = <tspan id="tOuter" fill="#e8eaed" font-weight="800">54</tspan> mm</text>
    </svg>
  </div>

  <div class="grid">
    <div class="mini tip" tabindex="0"
         data-tip="Ancho de la banda de squish en cada lado del cilindro. Es la mitad del anillo: (exterior − interior) ÷ 2.">
      <div class="v"><span id="band">7,91</span> mm</div>
      <div class="k">Banda por lado</div>
    </div>
    <div class="mini tip" tabindex="0"
         data-tip="Ancho total del anillo de squish, sumando los dos lados: exterior − interior.">
      <div class="v"><span id="bandT">15,82</span> mm</div>
      <div class="k">Anillo total</div>
    </div>
  </div>

  <p class="foot">
    Interior = Ø&nbsp;exterior × √(1 − %)<br>
    Banda por lado = (Ø&nbsp;exterior − interior) ÷ 2
  </p>

  <p class="credit">Desarrollado por <a href="https://github.com/roberto3101" target="_blank" rel="noopener">@roberto3101</a></p>
</div>

<script>
  const diam  = document.getElementById('diam');
  const pct   = document.getElementById('pct');
  const out   = document.getElementById('out');
  const eq    = document.getElementById('eq');
  const band  = document.getElementById('band');
  const bandT = document.getElementById('bandT');
  const presets = document.querySelectorAll('.preset');
  // svg refs
  const cInner  = document.getElementById('cInner');
  const cInner2 = document.getElementById('cInner2');
  const dLine   = document.getElementById('dLine');
  const bArrow  = document.getElementById('bArrow');
  const tInner  = document.getElementById('tInner');
  const tBand   = document.getElementById('tBand');
  const tOuter  = document.getElementById('tOuter');

  const CX = 160, CY = 190, R_OUT = 108; // geometría del svg

  const fmt = (n) => isFinite(n) ? parseFloat(n.toFixed(2)).toLocaleString('es-ES') : '0';

  function calc(){
    const D = Math.max(0, parseFloat(diam.value) || 0);
    let p   = parseFloat(pct.value) || 0;
    if (p < 0)    p = 0;
    if (p > 99.9) p = 99.9;               // evita raíz de número negativo
    const S = p/100;

    const interior = D * Math.sqrt(1 - S); // fórmula real del squish (por área)
    const lado     = (D - interior) / 2;
    const total    = D - interior;

    out.textContent   = fmt(interior);
    band.textContent  = fmt(lado);
    bandT.textContent = fmt(total);
    eq.textContent    = `${fmt(p)}% de squish sobre Ø ${fmt(D)} mm`;

    // --- dibujo dinámico ---
    const ratio = D > 0 ? interior / D : 1;       // 0..1
    const rIn   = R_OUT * ratio;                  // radio interior en px
    const xInEdge  = CX + rIn;                     // borde interior (derecha)
    const xOutEdge = CX + R_OUT;                   // borde exterior (derecha)

    cInner .setAttribute('r', rIn.toFixed(1));
    cInner2.setAttribute('r', rIn.toFixed(1));
    dLine.setAttribute('x1', (CX - rIn).toFixed(1));
    dLine.setAttribute('x2', (CX + rIn).toFixed(1));
    bArrow.setAttribute('x1', xInEdge.toFixed(1));
    bArrow.setAttribute('x2', xOutEdge.toFixed(1));

    tInner.textContent = 'Ø ' + fmt(interior);
    tBand.textContent  = fmt(lado);
    tBand.setAttribute('x', ((xInEdge + xOutEdge) / 2).toFixed(1));
    tOuter.textContent = fmt(D);

    presets.forEach(b => b.classList.toggle('active', parseFloat(b.dataset.p)===p));
  }

  presets.forEach(b => b.addEventListener('click', () => { pct.value = b.dataset.p; calc(); }));
  diam.addEventListener('input', calc);
  pct.addEventListener('input', calc);

  // botones +/- (mouse y táctil, con auto-repetición al mantener presionado)
  document.querySelectorAll('.step').forEach(btn => {
    const target = document.getElementById(btn.dataset.target);
    const dir = parseFloat(btn.dataset.dir);
    const bump = () => {
      const step = parseFloat(target.dataset.step) || 1;
      const min = target.min !== '' ? parseFloat(target.min) : -Infinity;
      const max = target.max !== '' ? parseFloat(target.max) :  Infinity;
      let v = (parseFloat(target.value) || 0) + dir * step;
      v = Math.min(max, Math.max(min, v));
      target.value = Math.round(v * 1000) / 1000;
      calc();
    };
    let to, iv;
    const start = (e) => { e.preventDefault(); bump(); to = setTimeout(() => { iv = setInterval(bump, 90); }, 380); };
    const stop  = () => { clearTimeout(to); clearInterval(iv); };
    btn.addEventListener('pointerdown', start);
    ['pointerup','pointerleave','pointercancel'].forEach(ev => btn.addEventListener(ev, stop));
  });

  calc();

  // PWA: service worker para instalar y usar sin internet
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }
</script>
</body>
</html>
